name: Feature request
description: Suggest an idea or improvement for thaizip
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / API
        - React hook
        - Data (wrong or missing address / zip code)
        - Docs
        - Other
