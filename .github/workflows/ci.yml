name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No dependency install scripts: nothing in the toolchain needs them.
      - run: npm ci --ignore-scripts
      # Also verifies data/*.json against data/SHA256SUMS, and that the
      # committed defaultData.ts matches what the raw tables generate.
      - run: npm run generate-data
      - run: git diff --exit-code -- src/data/defaultData.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
